/* ================= THEME ================= */
(function(){
  try {
    if(localStorage.getItem('fi32-theme')==='dark' || (!localStorage.getItem('fi32-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      const scopeEl = document.getElementById('fundinfoScope');
      if (scopeEl) scopeEl.classList.add('dark');
    }
  } catch(e) {}
})();
function toggleTheme(){
  const d = document.documentElement.classList.toggle('dark');
  const scopeEl = document.getElementById('fundinfoScope');
  if (scopeEl) scopeEl.classList.toggle('dark', d);
  try{localStorage.setItem('fi32-theme', d ? 'dark' : 'light');}catch(e){}
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = d ? '☀️' : '🌙';
  render();
}

/* ================= ENTITIES ================= */
function selectedScopeStocks(scope){const ids=Array.isArray(scope)?scope:scope?[scope]:[],names=new Set();ids.forEach(id=>{const sc=SCOPES.find(s=>s.id===id);if(sc)(sc.stocks||[]).forEach(name=>names.add(name));});return names;}
function buildStockEntities(fs,scope){const g={},scopeSet=selectedScopeStocks(scope);
  fs.forEach(f=>(f.top5||[]).forEach(([name,weight])=>{const meta=STOCK_META[name];if(!meta||scopeSet.size&&!scopeSet.has(name))return;const x=g[name]||(g[name]={id:name,name,ticker:meta.ticker,sector:meta.sector,country:meta.country,meta,holdings:[],membersMap:new Map(),totalWeight:0});x.holdings.push({fund:f,weight});x.membersMap.set(f.id,f);x.totalWeight+=weight;}));
  return Object.values(g).map((x,i)=>{const members=[...x.membersMap.values()],ret=x.meta.ret;return{idx:i,kind:'stock',id:x.id,title:`${x.ticker} · ${x.name}`,name:x.name,ticker:x.ticker,sector:x.sector,country:x.country,meta:x.meta,holdings:x.holdings,members,totalWeight:+x.totalWeight.toFixed(1),avgWeight:+(x.totalWeight/members.length).toFixed(1),fundCount:members.length,perf:ret,pop:members.reduce((s,f)=>s+f.pop,0),div:x.meta.div,flowP:{w1:x.totalWeight,m1:x.totalWeight,y1:x.totalWeight},retP:{m1:+(ret*.16).toFixed(1),q1:+(ret*.42).toFixed(1),y1:ret,y3:+(ret*.76).toFixed(1),y5:+(ret*.68).toFixed(1)}};});
}
function computeScopes(){const fs=baseFunds(),g={};
  const add=(k,f)=>{if(!k)return;(g[k]=g[k]||[]).push(f);};
  if(state.tab==='feeder')fs.forEach(f=>add((INSIGHT[f.master]||{}).theme||f.themes[0],f));
  else if(isStockTab()){SCOPES=stockTaxonomy().map((def,i)=>{let members=[],stockNames=[];if(def.fundIds){members=fs.filter(f=>def.fundIds.includes(f.id));stockNames=[...new Set(members.flatMap(f=>(f.top5||[]).map(h=>h[0])).filter(name=>STOCK_META[name]))];}else{const wanted=new Set(def.stocks||[]);stockNames=[...wanted].filter(name=>STOCK_META[name]&&fs.some(f=>(f.top5||[]).some(h=>h[0]===name)));members=fs.filter(f=>(f.top5||[]).some(h=>wanted.has(h[0])));}const memberIds=new Set(members.map(f=>f.id));let exposure=0,weightedReturn=0;fs.forEach(f=>(f.top5||[]).forEach(([name,weight])=>{if(!STOCK_META[name]||!stockNames.includes(name)||def.fundIds&&!memberIds.has(f.id))return;exposure+=weight;weightedReturn+=weight*STOCK_META[name].ret;}));const hasData=exposure>0;return{id:def.id,title:def.title,subtitle:def.subtitle,idx:i,members,stocks:stockNames,stockCount:stockNames.length,exposure:+exposure.toFixed(1),perf:hasData?+(weightedReturn/exposure).toFixed(1):null,flow:+exposure.toFixed(1),hasData};});state.stockScopeSelections=state.stockScopeSelections.filter(id=>SCOPES.some(s=>s.id===id&&s.hasData));state.scope=null;return;}
  else fs.forEach(f=>(f.mix||f.asset||[]).filter(a=>a[1]>=10).forEach(a=>add(a[0],f)));
  SCOPES=Object.entries(g).map(([k,ms],i)=>{const uniq=[...new Map(ms.map(f=>[f.id,f])).values()];return{id:k,title:k,idx:i,members:uniq,perf:+(uniq.reduce((s,f)=>s+f.perf,0)/uniq.length).toFixed(1),flow:uniq.reduce((s,f)=>s+f.netbuy,0)};});
  if(state.tab==='feeder')state.themeSelections=state.themeSelections.filter(id=>SCOPES.some(s=>s.id===id));
  if(state.scope&&!SCOPES.some(s=>s.id===state.scope))state.scope=null;
}
function computeEntities(){const fs=funds();
  if(isStockTab()){ENTS=buildStockEntities(baseFunds(),state.stockScopeSelections);return;}
  if(state.tab==='mixed'){ENTS=fs.map((f,i)=>({idx:i,kind:'fund',id:f.id,title:f.name,members:[f],perf:f.perf,pop:f.pop,div:f.div,flowP:f.flowP,retP:f.retP}));return;}
  const key=f=>f.master;
  const g={};fs.forEach(f=>{const k=key(f);(g[k]=g[k]||[]).push(f);});
  const avg=a=>+(a.reduce((s,x)=>s+x,0)/a.length).toFixed(1),sum=a=>a.reduce((s,x)=>s+x,0);
  ENTS=Object.entries(g).map(([k,ms],i)=>{const flowP={},retP={};['w1','m1','y1'].forEach(p=>flowP[p]=sum(ms.map(m=>m.flowP[p])));['m1','q1','y1','y3','y5'].forEach(p=>retP[p]=avg(ms.map(m=>m.retP[p])));
    return{idx:i,kind:state.tab==='feeder'?'master':'theme',id:k,title:k,members:ms,perf:avg(ms.map(m=>m.perf)),pop:sum(ms.map(m=>m.pop)),div:Math.max(...ms.map(m=>m.div)),flowP,retP};});}
function autoSelect(){

function insightFor(ent){
  const cur=INSIGHT[ent.id];
  if(cur)return cur;
  // generic fallback from members
  const ms=ent.members,agg={};ms.forEach(m=>m.top5.forEach(t=>agg[t[0]]=(agg[t[0]]||0)+t[1]));
  const top=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n,w])=>[n,n.slice(0,4).toUpperCase(),+(w/ms.length).toFixed(1),+(ent.perf*0.7).toFixed(1)]);
  return{theme:ent.title,narr:'ธีมการลงทุนที่รวมกองทุนซึ่งมีนโยบายและพอร์ตใกล้เคียงกัน ให้ภาพรวมทิศทางและหุ้น/สินทรัพย์ที่ถืออยู่',pe:null,pb:null,flow:ent.flowP.y1,bench:'Benchmark',
    master:{name:ent.members[0].master||ent.title,amc:ent.members[0].amc,aum:'—',incep:'—',te:2.5,pm:'—'},top};
}

const COMPARE_DASH=[[],[8,3],[3,2],[10,3,2,3],[6,2],[2,2],[12,3]];

function performanceSeries(seed,fin,n){n=n||13;let s=seed,noise=[0];for(let i=1;i<n;i++){s=(s*9301+49297)%233280;noise.push((s/233280-.5)*10+Math.sin(i*.9+seed%5)*2.8);}const end=noise[n-1];return noise.map((v,i)=>+(100+(fin*i/(n-1))+v-(end*i/(n-1))).toFixed(1));}
function avgMaxDrawdown(ent){return +(ent.members.reduce((sum,f)=>sum+f.st.maxdd,0)/ent.members.length).toFixed(1);}

function buildMasterCompareChart(selected){
  const id = 'master-compare-chart', el = document.getElementById(id);
  if(!el) return;
  destroyChart(id);
  const bench = isStockTab() ? compareBenchmark() : { name: 'MSCI ACWI', ret: GLOBAL_RETURN };
  const datasets = selected.map((ent, i) => {
    const rawLabel = ent.kind === 'stock' ? `${ent.ticker} · ${ent.name}` : insightFor(ent).master.name;
    const tickerSuffix = ent.title.includes('NASDAQ') ? ' (QQQM)' : ent.title.includes('Gold') ? ' (GLD)' : '';
    const label = `${i + 1}. ${rawLabel}${tickerSuffix}`;
    const seed = [...sid(ent.id)].reduce((a, c) => a + c.charCodeAt(0), 31);
    return {
      label,
      data: performanceSeries(seed, ent.perf, CMP_LABELS.length),
      borderColor: COMPARE_COLORS[i % COMPARE_COLORS.length],
      backgroundColor: COMPARE_COLORS[i % COMPARE_COLORS.length],
      borderWidth: 2.4,
      borderDash: COMPARE_DASH[i % COMPARE_DASH.length],
      pointRadius: 0,
      pointHoverRadius: 4,
      tension: 0.32,
      fill: false
    };
  });
  datasets.push({
    label: `${bench.name} · จุดอ้างอิง`,
    data: performanceSeries(731, bench.ret, CMP_LABELS.length),
    borderColor: '#94a3b8',
    backgroundColor: '#94a3b8',
    borderWidth: 2,
    borderDash: [5, 4],
    pointRadius: 0,
    pointHoverRadius: 4,
    tension: 0.3,
    fill: false
  });
  charts[id] = new Chart(el, {
    type: 'line',
    data: { labels: CMP_LABELS, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: true,
          position: 'bottom',
          labels: { usePointStyle: true, pointStyle: 'line', boxWidth: 24, font: { size: 10 }, padding: 12 }
        },
        tooltip: {
          callbacks: { label: c => ` ${c.dataset.label}: ${(c.parsed.y - 100).toFixed(1)}%` }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 7 } },
        y: { ticks: { font: { size: 9 }, callback: v => (v - 100) + '%' }, grid: { color: 'rgba(148,163,184,.16)' } }
      }
    }
  });
}

    return;
  }
  wrap.classList.remove('hidden');
  const rows = [
    ['ประเภท', f => TYPES[f.type].label],
    ['1Y Return', f => `<span class="num font-bold ${f.perf >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${pct(f.perf)}</span>`],
    ['Sharpe Ratio', f => `<b class="num txt font-bold">${f.st.sharpe}</b>`],
    ['Max Drawdown', f => `<b class="num text-rose-600 font-bold">${f.st.maxdd}%</b>`],
    ['เงินปันผล', f => `<b class="num text-emerald-600 font-bold">${f.div.toFixed(1)}%</b>`],
    ['TER (ค่าธรรมเนียม)', f => `<b class="num txt font-bold">${f.fee.toFixed(2)}%</b>`],
    ['Master Fund', f => `<span class="truncate block max-w-[200px]" title="${f.master || '—'}">${f.master || '—'}</span>`]
  ];
  
  wrap.innerHTML = `
    <section class="fund-matrix surf brd rounded-2xl overflow-hidden shadow-xs">
      <header class="fund-matrix-heading flex items-center justify-between px-4 py-3 bg-slate-50 dark:bg-slate-800/80 brdb">
        <button type="button" class="fund-matrix-title font-black text-xs txt flex items-center gap-1.5" onclick="state.cmpCollapsed = !state.cmpCollapsed; renderCompare();">
          <span>${state.cmpCollapsed ? '▶' : '▼'}</span>
          <span>เปรียบเทียบกองทุนที่เลือก (${items.length})</span>
        </button>
        <button type="button" class="fund-matrix-clear text-xs font-bold sub hover:text-rose-600 transition" onclick="pins=[];savePins();renderCompare();updateCmpBtn();render();">ล้าง ✕</button>
      </header>
      ${state.cmpCollapsed ? '' : `
        <div class="overflow-x-auto">
          <table class="fund-matrix-table table-fixed w-full text-xs border-collapse">
            <thead>
              <tr class="bg-slate-50/50 dark:bg-slate-850/50 brdb text-slate-600 dark:text-slate-400">
                <th class="w-[140px] p-3 text-left sub font-bold sticky left-0 surf2 z-10">ข้อมูล</th>
                ${items.map(f => `
                  <th class="p-3 text-left relative min-w-[150px]">
                    <div class="flex items-center justify-between gap-1 pr-6">
                      <b class="txt font-extrabold text-xs truncate" title="${f.name}">${f.id}</b>
                      <button type="button" class="absolute top-2.5 right-2.5 text-xs font-bold sub hover:text-rose-600 w-5 h-5 flex items-center justify-center rounded-md hover:bg-slate-200 dark:hover:bg-slate-700 transition" onclick="togglePin('${f.id}')" title="นำออกจากเปรียบเทียบ">×</button>
                    </div>
                    <div class="text-[10px] sub font-normal truncate mt-0.5" title="${f.amc}">${f.amc}</div>
                  </th>
                `).join('')}
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
              ${rows.map(r => `
                <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition">
                  <td class="p-3 sub font-medium sticky left-0 surf z-10 brdr">${r[0]}</td>
                  ${items.map(f => `<td class="p-3">${r[1](f)}</td>`).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </section>
  `;
}

/* ================= RENDER ================= */
function render(){
  state.search=document.getElementById('search').value;
  const t=TYPES[state.tab];
  document.getElementById('pt').textContent=t.label;
  document.getElementById('ps').textContent=t.sub;
  const pBadge=document.getElementById('pBadge');
  if(pBadge) pBadge.textContent=`${t.emoji} ${t.label.toUpperCase()}`;
  const pStats=document.getElementById('pStats');
  if(pStats){
    pStats.innerHTML=`
      <span class="px-3 py-1 rounded-full surf2 brd text-slate-600 dark:text-slate-300 font-medium">ความครอบคลุม: <b class="num txt font-extrabold">${baseFunds().length} กองทุน</b></span>
      <span class="px-3 py-1 rounded-full surf2 brd text-slate-600 dark:text-slate-300 font-medium">หมวดหมู่: <b class="txt font-extrabold">${SCOPES.length} กลุ่ม</b></span>
    `;
  }
  document.getElementById('search').placeholder=isStockTab()?'ค้นหาชื่อกองทุน / หุ้นที่ถือ (NVIDIA, Microsoft, PTT, ADVANC)':'ค้นหาชื่อกองทุน / Master Fund / หุ้นที่ถือ (NVIDIA, Microsoft, PTT, ADVANC)';
  computeScopes();computeEntities();state.groups=state.groups.filter(id=>ENTS.some(e=>e.id===id));renderTabs();renderTrend();renderCards();renderSelectionBar();renderInsight();renderQuickFilters();renderFilters();
  const list=currentFunds();
  document.getElementById('cnt').textContent=`พบ ${list.length} กองทุน`;
  const th = document.getElementById('tableHeading');
  if(th) th.textContent = `กองทุนที่ตรงเงื่อนไข ${list.length} กอง ⓘ`;
  renderFundTable(list);
  
  const drawerHeading=document.getElementById('drawerHeading');
  if(drawerHeading){ drawerHeading.classList.add('hidden'); drawerHeading.innerHTML=''; }
  const listEl=document.getElementById('list');
  if(listEl) listEl.innerHTML='';
  document.getElementById('empty').classList.add('hidden');
  
  const opened=list.filter(f=>state.open.has(f.id));
  FUNDS.filter(f=>!state.open.has(f.id)).forEach(f=>{destroyChart(sid(f.id)+'-cyr');destroyChart(sid(f.id)+'-asset');destroyChart(sid(f.id)+'-top5pie');});
  opened.forEach(f=>{buildCyr(f);buildAsset(f);buildTop5Pie(f);});
  renderCompare();updateCmpBtn();updateWatchCount();
  document.getElementById('themeBtn').textContent=document.documentElement.classList.contains('dark')?'☀️':'🌙';
}
autoSelect();render();
</script>
</body>
</html>
