FUNDS.forEach(f=>{
  const h=[...f.id].reduce((a,c)=>a+c.charCodeAt(0),0);
  const j=(s,sc)=>(((h*s)%11)/11-0.5)*sc;
  f.flowP={w1:Math.round(f.netbuy*(0.3+j(3,0.15))),m1:f.netbuy,y1:Math.round(f.netbuy*(6+j(7,1.4)))};
  f.retP={m1:+(f.perf*(0.14+j(2,0.06))).toFixed(1),q1:+(f.perf*(0.42+j(4,0.12))).toFixed(1),y1:f.perf,y3:+(f.perf*(0.76+j(6,0.18))).toFixed(1),y5:+(f.perf*(0.68+j(8,0.18))).toFixed(1)};

  f.aum=Math.max(30,Math.round(f.pop/90));
  f.group=GROUP[f.country]||(f.type==='thai'?'Thai Equity':f.type==='mixed'?'Mixed / Allocation':'Foreign Equity');
  f.amcCode=AMC[f.amc]||f.amc.slice(0,2);
  f.sectors=SECTORS[f.id]||null;
  
  let fx;
  if(f.type==='thai'||f.type==='mixed') fx=null;
  else if(/ป้องกันค่าเงิน/.test(f.name)) fx=100;
  else {
    const m=h%3;
    fx=m===0?0:m===1?100:Math.round(35+Math.abs(j(15,50)));
  }
  
  f.wrapper=WRAPPER_TYPES[h%WRAPPER_TYPES.length];
  f.minInvest=[1,500,1000,5000][h%4];
  
  f.st={

    beta:+(0.82+Math.abs(j(11,0.35))).toFixed(2),
    maxdd:+(-(18+Math.abs(j(12,35)))).toFixed(2),
    recover:Math.round(4+Math.abs(j(13,9))),
    fxhedge:fx
  };
  
  f.cyr=['2564','2565','2566','2567','2568'].map((y,i)=>{
    const s=((h*(i+3))%97)/97-0.42;
    return[y,+((f.perf*0.55)+s*42).toFixed(1)];
  });

<script>

const urlParams = new URLSearchParams(window.location.search);
let fundId = urlParams.get('id') || 'SCBNDQ';

if (fundId.toUpperCase() === 'K-GHEALTH') {
  fundId = 'KGHEALTH';
}
const fund = FUNDS.find(x => x.id.toUpperCase() === fundId.toUpperCase());

const charts = {};
let currentMode = 'nav';
let currentRange = '1Y';
let currentMetric = 'sd';

// Theme support
(function(){
  try {
    if(localStorage.getItem('fi32-theme')==='dark') {
      document.documentElement.classList.add('dark');
      updateThemeBtn(true);
    } else {
      updateThemeBtn(false);
    }
  } catch(e){}
})();

function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  try {
    localStorage.setItem('fi32-theme', isDark ? 'dark' : 'light');
  } catch(e){}
  updateThemeBtn(isDark);
  // Re-draw visible elements
  renderTopBar();
  const activeTab = getActiveTab();
  if (activeTab === 'overview') updateNavChart();
  else if (activeTab === 'performance') renderCyrChart();
  else if (activeTab === 'portfolio') renderPortfolioCharts();
}

function updateThemeBtn(isDark) {
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = isDark ? '☀️' : '🌙';
}

function getActiveTab() {
  const tabs = ['overview', 'performance', 'portfolio', 'fees', 'documents'];
  for (const t of tabs) {
    const btn = document.getElementById(`tab-${t}`);
    if (btn && btn.classList.contains('border-brand-600')) return t;
  }
  return 'overview';
}

// Format percentage text with colors
function getPctHTML(n) {
  return `<span class="num font-bold ${n < 0 ? 'text-neg-600' : 'text-pos-600'}">${n > 0 ? '+' : ''}${n}%</span>`;
}

// Generate realistic deterministic NAV, Total Return, and Benchmark values
function getNavHistory(f, range) {
  const seed = [...f.id].reduce((a,c)=>a+c.charCodeAt(0),0);
  let days = 30;
  if (range === '1M') days = 30;
  else if (range === '3M') days = 90;
  else if (range === '1Y') days = 250;
  else if (range === '3Y') days = 750;
  else if (range === '5Y') days = 1250;
  else days = 1750;

  const navData = [];
  const totalReturnData = [];
  const benchmarkData = [];
  const labels = [];
  
  const annualReturn = f.perf / 100;
  const dailyReturn = annualReturn / 250;
  const dailyVolatility = f.st.sd / 100 / Math.sqrt(250);
  
  const isIndex = f.master && /Index|ETF/i.test(f.master);
  const benchDailyReturn = isIndex ? dailyReturn : dailyReturn - (0.4 / 100 / 250);
  const benchVolatility = dailyVolatility * 0.9;

  const dailyReturns = [];
  const benchReturns = [];
  
  let rState = seed;
  function nextRand() {
    rState = (rState * 9301 + 49297) % 233280;
    return (rState / 233280) - 0.5;
  }
  
  let rStateB = seed + 777;
  function nextRandB() {
    rStateB = (rStateB * 9301 + 49297) % 233280;
    return (rStateB / 233280) - 0.5;
  }

  for (let i = 0; i < days; i++) {
    dailyReturns.push(dailyReturn + nextRand() * dailyVolatility);
    benchReturns.push(benchDailyReturn + nextRandB() * benchVolatility);
  }

  const rawNav = [];
  const rawTr = [];
  const rawBench = [];
  
  let currentNav = 10.0;
  let currentTr = 10.0;
  let currentBench = 10.0;
  
  for (let i = 0; i < days; i++) {
    const ret = dailyReturns[i];
    const bRet = benchReturns[i];
    
    currentTr = currentTr * (1 + ret);
    currentBench = currentBench * (1 + bRet);
    
    if (f.div > 0 && i > 0 && i % 120 === 0) {
      const divFactor = f.div / 100 / 2;
      currentNav = currentNav * (1 + ret) * (1 - divFactor);
    } else {
      currentNav = currentNav * (1 + ret);
    }
    
    rawNav.push(currentNav);
    rawTr.push(currentTr);
    rawBench.push(currentBench);
  }
  
  const scale = f.nav / rawNav[rawNav.length - 1];
  const today = new Date('2026-08-20');
  
  for (let i = 0; i < days; i++) {
    const d = new Date(today);
    const calendarDaysAgo = Math.round((days - 1 - i) * 1.4);
    d.setDate(today.getDate() - calendarDaysAgo);

    let dateStr = '';
    if (range === '1M' || range === '3M') {
      dateStr = d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
    } else {
      dateStr = d.toLocaleDateString('th-TH', { month: 'short', year: '2-digit' });
    }
    
    labels.push(dateStr);
    navData.push(Number((rawNav[i] * scale).toFixed(4)));
    totalReturnData.push(Number((rawTr[i] * scale).toFixed(4)));
    benchmarkData.push(Number((rawBench[i] * scale).toFixed(4)));
  }

  const step = Math.max(1, Math.round(days / 12));
  const cleanLabels = labels.map((l, index) => (index % step === 0 || index === days - 1) ? l : '');
  
  return { labels: cleanLabels, rawLabels: labels, navData, totalReturnData, benchmarkData };
}

// Generate benchmark return deterministically
function getBenchmarkReturn(fundReturn, seed, isIndex) {
  if (isIndex) {
    return +(fundReturn - (0.05 * (seed % 3 - 1))).toFixed(1);
  }
  return +(fundReturn - (0.4 + (seed % 5) * 0.3)).toFixed(1);
}

// Format number with commas
function formatNumber(num) {
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function getGroupAverage(val, seed) {
  const offset = (((seed * 7) % 11) / 11 - 0.5) * 2;
  return +(val - 0.5 + offset).toFixed(1);
}

function getDividendHistoryHTML(f) {
  if (f.div === 0) {
    return `
      <tr class="border-b border-slate-100 dark:border-slate-800/40">
        <td colspan="3" class="p-8 text-center text-slate-400 dark:text-slate-500 font-sans">ไม่มีประวัติการปันผล</td>
      </tr>
    `;
  }
  const h = [...f.id].reduce((a,c)=>a+c.charCodeAt(0),0);
  const years = [2569, 2569, 2568, 2568, 2567, 2567, 2566, 2566, 2565, 2565];
  const months = ['ก.ค.', 'ก.พ.', 'พ.ย.', 'ก.ค.', 'เม.ย.', 'ม.ค.', 'ก.ย.', 'พ.ค.', 'พ.ย.', 'พ.ค.'];
  const divValue = f.div / 2;
  
  return years.map((y, idx) => {
    const shortYear = y.toString().substring(2);
    const closedDate = `${(h + idx * 7) % 25 + 1} ${months[idx]} ${shortYear}`;
    const paidDate = `${(h + idx * 7) % 25 + 5} ${months[idx]} ${shortYear}`;
    const amount = (divValue * (1 - idx * 0.05)).toFixed(1);
    
    const rowClass = idx >= 5 ? 'dividend-row-extra hidden' : 'dividend-row';
    
    return `
      <tr class="border-b border-slate-100 dark:border-slate-800/40 hover:bg-slate-50/50 dark:hover:bg-slate-800/20 text-sm ${rowClass}">
        <td class="p-3 font-medium text-slate-700 dark:text-slate-300">${closedDate}</td>
        <td class="p-3 text-slate-600 dark:text-slate-400">${paidDate}</td>
        <td class="p-3 text-right num font-extrabold text-brand-600 dark:text-brand-400">${amount}</td>
      </tr>
    `;
  }).join('');
}

function getRecoveringPeriodText(months) {
  const yrs = Math.floor(months / 12);
  const mths = months % 12;
  let t = '';
  if (yrs > 0) t += `${yrs} ปี `;
  if (mths > 0 || yrs === 0) t += `${mths} เดือน`;
  return t;
}

// Update NAV interactive chart
function updateNavChart() {
  if (!window.Chart || !fund) return;
  const acc = TYPES[fund.type].acc;
  const isDark = document.documentElement.classList.contains('dark');
  const textColor = isDark ? '#93a3c0' : '#607091';
  const gridColor = isDark ? 'rgba(148,163,184,.08)' : 'rgba(148,163,184,.14)';

  // Update active state of mode buttons
  ['nav', 'return'].forEach(m => {
    const btn = document.getElementById(`mode-${m}`);
    if (btn) {
      if (m === currentMode) {
        btn.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-brand-600', 'dark:text-white');
        btn.classList.remove('text-slate-500', 'dark:text-slate-400', 'hover:text-slate-800', 'dark:hover:text-slate-200');
      } else {
        btn.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-brand-600', 'dark:text-white');
        btn.classList.add('text-slate-500', 'dark:text-slate-400', 'hover:text-slate-800', 'dark:hover:text-slate-200');
      }
    }
  });

  // Update active state of range buttons
  ['1M', '3M', '1Y', '3Y', '5Y', 'Max'].forEach(r => {
    const btn = document.getElementById(`range-${r}`);
    if (btn) {
      if (r === currentRange) {
        btn.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-brand-600', 'dark:text-white');
        btn.classList.remove('text-slate-500', 'dark:text-slate-400', 'hover:text-slate-800', 'dark:hover:text-slate-200');
      } else {
        btn.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-brand-600', 'dark:text-white');
        btn.classList.add('text-slate-500', 'dark:text-slate-400', 'hover:text-slate-800', 'dark:hover:text-slate-200');
      }
    }
  });

  const navEl = document.getElementById('navChart');
  if (!navEl) return;
  
  if (charts['nav']) charts['nav'].destroy();

  const history = getNavHistory(fund, currentRange);
  const datasets = [];
  
  if (currentMode === 'nav') {
    datasets.push({
      label: 'ราคา NAV',
      data: history.navData,
      borderColor: acc,
      borderWidth: 2,
      pointRadius: 0,
      pointHoverRadius: 4,
      fill: true,
      backgroundColor: getGradient(navEl, acc),
      tension: 0.1
    });
  } else if (currentMode === 'return') {
    const fundStart = history.navData[0];
    const benchStart = history.benchmarkData[0];
    
    const fundPctData = history.navData.map(v => +((v / fundStart - 1) * 100).toFixed(2));
    const benchPctData = history.benchmarkData.map(v => +((v / benchStart - 1) * 100).toFixed(2));
    
    datasets.push({
      label: 'ผลตอบแทนกองทุน (%)',
      data: fundPctData,
      borderColor: acc,
      borderWidth: 2.5,
      pointRadius: 0,
      pointHoverRadius: 4,
      fill: false,
      tension: 0.1
    });
    
    datasets.push({
      label: 'ผลตอบแทนเกณฑ์มาตรฐาน (%)',
      data: benchPctData,
      borderColor: '#94a3b8',
      borderWidth: 1.5,
      borderDash: [4, 4],
      pointRadius: 0,
      pointHoverRadius: 4,
      fill: false,
      tension: 0.1
    });
  }

  charts['nav'] = new Chart(navEl, {
    type: 'line',
    data: {
      labels: history.labels,
      datasets: datasets
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        intersect: false,
        mode: 'index'
      },
      plugins: {
        legend: {
          display: currentMode === 'return',
          position: 'top',
          labels: {
            font: { size: 11 },
            color: textColor,
            boxWidth: 12
          }
        },
        tooltip: {
          callbacks: {
            title: context => {
              const idx = context[0].dataIndex;
              return history.rawLabels[idx];
            },
            label: context => {
              const val = context.parsed.y;
              if (currentMode === 'return') {
                return ` ${context.dataset.label}: ${val > 0 ? '+' : ''}${val.toFixed(2)}%`;
              } else {
                return ` ${context.dataset.label}: ${val.toFixed(4)} ฿`;
              }
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            font: { size: 11 },
            color: textColor,
            maxRotation: 0,
            autoSkip: false
          }
        },
        y: {
          ticks: {
            font: { size: 11 },
            color: textColor,
            callback: v => {
              if (currentMode === 'return') {
                return (v > 0 ? '+' : '') + v.toFixed(1) + '%';
              } else {
                return v.toFixed(2) + ' ฿';
              }
            }
          },
          grid: { color: gridColor }
        }
      }
    }
  });
}

function getGradient(canvas, color) {
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, 0, 240);
  gradient.addColorStop(0, `${color}44`);
  gradient.addColorStop(1, `${color}00`);
  return gradient;
}

// Portfolio Doughnut charts helper
function makeDoughnut(canvasId, labels, data, colors) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const isDark = document.documentElement.classList.contains('dark');
  
  if (charts[canvasId]) charts[canvasId].destroy();
  
  charts[canvasId] = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        data: data,
        backgroundColor: colors,
        borderWidth: isDark ? 2 : 1,
        borderColor: isDark ? '#151f33' : '#ffffff'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '65%',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: context => ` ${context.label}: ${context.parsed.toFixed(1)}%`
          }
        }
      }
    }
  });
}

function renderPortfolioCharts() {
  if (!window.Chart || !fund) return;
  
  // 1. Asset allocation
  makeDoughnut('assetChart', fund.asset.map(a => a[0]), fund.asset.map(a => a[1]), ASSET_COLORS);
  
  // 2. Sector allocation

  makeDoughnut('holdingChart', holdingData.map(h => h[0]), holdingData.map(h => h[2]), HOLDING_COLORS);

        <button onclick="switchTab('portfolio')" id="tab-portfolio" class="pb-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 font-bold transition">สัดส่วนการลงทุน</button>
        <button onclick="switchTab('fees')" id="tab-fees" class="pb-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 font-bold transition">ค่าธรรมเนียม</button>
        <button onclick="switchTab('documents')" id="tab-documents" class="pb-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 font-bold transition">เอกสารเพิ่มเติม</button>
      </div>

      <!-- Tab panels -->
      
      <!-- Panel 1: กราฟภาพรวม -->
      <div id="panel-overview" class="tab-panel">
        <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">
          <div class="flex bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg text-xs font-extrabold font-num">
            <button id="mode-nav" onclick="changeChartMode('nav')" class="px-2.5 py-1 rounded-md bg-white dark:bg-slate-700 shadow-sm text-brand-600 dark:text-white transition font-bold font-sans">
              ราคา NAV (฿)
            </button>
            <button id="mode-return" onclick="changeChartMode('return')" class="px-2.5 py-1 rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition font-bold font-sans">
              ผลตอบแทน (%)
            </button>
          </div>
          
          <div class="flex bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg text-xs font-extrabold font-num">
            ${['1M', '3M', '1Y', '3Y', '5Y', 'Max'].map(r => `
              <button id="range-${r}" onclick="changeChartRange('${r}')" class="px-2.5 py-1 rounded-md ${r === '1Y' ? 'bg-white dark:bg-slate-700 shadow-sm text-brand-600 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200'} transition font-bold uppercase">
                ${r}
              </button>
            `).join('')}
          </div>
        </div>
        
        <!-- Graph container -->
        <div class="h-[400px] relative font-num py-2">
          <canvas id="navChart"></canvas>
        </div>
        <p class="text-[10px] sub text-right mt-1.5 font-sans">* หมายเหตุ: กราฟนี้เคลื่อนไหวโดยอ้างอิงจากลักษณะสถิติความผันผวนย้อนหลังของกองทุนรวมจริง</p>
      </div>

      <!-- Panel 2: ผลการดำเนินงานและปันผล -->
      <div id="panel-performance" class="tab-panel hidden">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
          <!-- Return comparison table -->
          <div>
            <h3 class="text-sm font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide mb-3 font-sans">ตารางเปรียบเทียบผลตอบแทน (Performance)</h3>
            <div class="overflow-x-auto border border-slate-200 dark:border-slate-800 rounded-xl font-num">
              <table class="w-full text-sm text-left">
                <thead>
                  <tr class="bg-slate-50 dark:bg-slate-800/50 sub border-b border-slate-200 dark:border-slate-800 font-bold">
                    <th class="p-3 font-sans">ช่วงเวลา</th>
                    <th class="p-3 text-right font-sans">กองทุนนี้</th>
                    <th class="p-3 text-right font-sans">เฉลี่ยกลุ่ม</th>
                  </tr>
                </thead>
                <tbody>
                  ${[
                    { label: '3 เดือน', fVal: fund.retP.q1 },
                    { label: '6 เดือน', fVal: +((fund.retP.y1 * 0.6).toFixed(1)) },
                    { label: '1 ปี', fVal: fund.retP.y1 },
                    { label: '3 ปี (annualized)', fVal: fund.retP.y3 },
                    { label: '5 ปี (annualized)', fVal: fund.retP.y5 },
                    { label: '10 ปี (annualized)', fVal: +((fund.retP.y5 * 1.5).toFixed(1)) }
                  ].map(row => `
                    <tr class="border-b border-slate-100 dark:border-slate-800/40 hover:bg-slate-50/50 dark:hover:bg-slate-800/20">
                      <td class="p-3 font-medium text-slate-700 dark:text-slate-300 font-sans">${row.label}</td>
                      <td class="p-3 text-right">${getPctHTML(row.fVal)}</td>
                      <td class="p-3 text-right num text-slate-500 dark:text-slate-400">${getGroupAverage(row.fVal, h)}%</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
            <p class="text-[10px] sub mt-1.5 font-sans">* เกณฑ์อ้างอิง: ${INSIGHT[fund.master]?.bench || INSIGHT[fund.themes[0]]?.bench || 'ดัชนีกลุ่มที่เหมาะสม'}</p>
          </div>

          <!-- Risk table with toggles -->
          <div>
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-sm font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide font-sans">ตารางเปรียบเทียบย้อนหลัง (ตัวชี้วัดความเสี่ยง)</h3>
              <!-- Metric toggles (SD, SHARPE RATIO, MAX DRAWDOWN) -->
              <div class="flex gap-1 bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg text-xs font-bold font-num">
                <button id="metric-sd" onclick="changeMetric('sd')" class="px-2.5 py-1.5 rounded bg-white dark:bg-slate-700 shadow-sm text-brand-600 dark:text-white font-bold uppercase transition font-sans">SD</button>
                <button id="metric-sharpe" onclick="changeMetric('sharpe')" class="px-2.5 py-1.5 rounded text-slate-500 dark:text-slate-400 font-bold uppercase transition font-sans">SHARPE RATIO</button>
                <button id="metric-maxdd" onclick="changeMetric('maxdd')" class="px-2.5 py-1.5 rounded text-slate-500 dark:text-slate-400 font-bold uppercase transition font-sans">MAX DRAWDOWN</button>
              </div>
            </div>
            
            <div class="overflow-x-auto border border-slate-200 dark:border-slate-800 rounded-xl font-num">
              <table class="w-full text-sm text-left">
                <thead>
                  <tr class="bg-slate-50 dark:bg-slate-800/50 sub border-b border-slate-200 dark:border-slate-800 font-bold">
                    <th class="p-3 font-sans">ช่วงเวลา</th>
                    <th class="p-3 text-right font-sans">กองทุนนี้</th>
                    <th class="p-3 text-right font-sans">เฉลี่ยกลุ่ม</th>
                  </tr>
                </thead>
                <tbody id="metricTableBody">
                  <!-- JS dynamic rows -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Lower section: stacked full-width rows -->
        <div class="flex flex-col gap-8">
          <!-- Calendar Year Returns (Full Width) -->
          <div class="border-t border-slate-100 dark:border-slate-800 pt-6">
            <h3 class="text-sm font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide mb-3 font-sans">ผลตอบแทนรายปีปฏิทิน (CALENDAR YEAR RETURNS)</h3>
            <div class="h-60 relative font-num py-2">
              <canvas id="cyrChart"></canvas>
            </div>
          </div>

          <!-- Dividend History (Full Width) -->
          <div class="border-t border-slate-100 dark:border-slate-800 pt-6">
            <h3 class="text-sm font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide mb-3 font-sans">ประวัติการปันผล (DIVIDEND HISTORY)</h3>
            <div class="overflow-x-auto border border-slate-200 dark:border-slate-800 rounded-xl font-num">
              <table class="w-full text-sm text-left">
                <thead>
                  <tr class="bg-slate-50 dark:bg-slate-800/50 sub border-b border-slate-200 dark:border-slate-800 font-bold">
                    <th class="p-3 font-sans">วันที่ปิดสมุดทะเบียน</th>
                    <th class="p-3 font-sans">วันที่ปันผล</th>
                    <th class="p-3 text-right font-sans">จำนวนเงิน(บาท)</th>
                  </tr>
                </thead>
                <tbody>
                  ${getDividendHistoryHTML(fund)}
                </tbody>
              </table>
            </div>
            ${fund.div > 0 ? `
            <div class="mt-4 flex justify-center">
              <button id="btn-toggle-dividends" onclick="toggleDividends()" class="px-6 py-1.5 border border-slate-200 dark:border-slate-800 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition flex items-center gap-1.5 font-sans">
                <span>ดูทั้งหมด</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-slate-400 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </button>
            </div>
            ` : ''}
          </div>
        </div>
      </div>

      <!-- Panel 3: สัดส่วนการลงทุน -->
      <div id="panel-portfolio" class="tab-panel hidden flex flex-col gap-8">
        
        <!-- Doughnut Chart 1: Asset Allocation -->
        <div>
          <h3 class="text-sm font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide mb-2.5 font-sans">สัดส่วนประเภทสินทรัพย์ (Asset Allocation)</h3>
          <div class="flex flex-col sm:flex-row items-center gap-8 py-4">
            <div class="w-44 h-44 shrink-0 relative flex items-center justify-center font-num">
              <canvas id="assetChart"></canvas>
            </div>
            <div class="flex-1 w-full">
              ${makeLegendHTML(fund.asset, ASSET_COLORS)}
            </div>
          </div>
        </div>

        <!-- Doughnut Chart 2: Sector Allocation -->
        <div class="border-t border-slate-200 dark:border-slate-800 pt-6">
          <h3 class="text-sm font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide mb-2.5 font-sans">สัดส่วนกลุ่มอุตสาหกรรม (Sector Allocation)</h3>
          <div class="flex flex-col sm:flex-row items-center gap-8 py-4">
            <div class="w-44 h-44 shrink-0 relative flex items-center justify-center font-num">
              <canvas id="sectorChart"></canvas>
            </div>
            <div class="flex-1 w-full">
              ${makeLegendHTML(fund.sectors || [['อื่น ๆ / ตราสารหนี้', 100.0]], SECTOR_COLORS)}
            </div>
          </div>
        </div>

        <!-- Doughnut Chart 3: Country Allocation -->
        <div class="border-t border-slate-200 dark:border-slate-800 pt-6">
          <h3 class="text-sm font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide mb-2.5 font-sans">สัดส่วนประเทศที่ลงทุน (Country Allocation)</h3>
          <div class="flex flex-col sm:flex-row items-center gap-8 py-4">
            <div class="w-44 h-44 shrink-0 relative flex items-center justify-center font-num">
              <canvas id="countryChart"></canvas>
            </div>
            <div class="flex-1 w-full">
              ${makeLegendHTML(getCountryAllocation(fund), COUNTRY_COLORS)}
            </div>
          </div>
        </div>

        <!-- Doughnut Chart 4: Top 10 Holdings -->
        <div class="border-t border-slate-200 dark:border-slate-800 pt-6">
          <h3 class="text-sm font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide mb-2.5 font-sans">หลักทรัพย์ที่ถือครองสูงสุด 10 อันดับแรก</h3>
          <div class="flex flex-col sm:flex-row items-center gap-8 py-4">
            <div class="w-44 h-44 shrink-0 relative flex items-center justify-center font-num">
              <canvas id="holdingChart"></canvas>
            </div>
            <div class="flex-1 w-full">
              ${makeLegendHTML(getTopHoldings(fund).map(h => [h[0], h[2]]), HOLDING_COLORS)}
            </div>
          </div>
        </div>
      </div>

      <!-- Panel 4: ค่าธรรมเนียม -->
      <div id="panel-fees" class="tab-panel hidden flex flex-col gap-6">
        <div class="max-w-2xl mx-auto w-full">
          <div class="mb-8">
            <h3 class="text-base font-bold text-slate-900 dark:text-slate-200 border-b border-slate-100 dark:border-slate-800 pb-3 mb-4 text-center font-sans">รายละเอียดการซื้อ</h3>
            <div class="divide-y divide-slate-100 dark:divide-slate-800/40 text-sm font-semibold font-sans">
              <div class="flex justify-between py-3.5">
                <span class="text-slate-500 dark:text-slate-400">มูลค่าขั้นต่ำของการซื้อครั้งแรก</span>
                <span class="num text-slate-900 dark:text-slate-200 font-medium text-base">${formatNumber(fund.minInvest)} บาท</span>
              </div>
              <div class="flex justify-between py-3.5">
                <span class="text-slate-500 dark:text-slate-400">มูลค่าขั้นต่ำของการซื้อครั้งต่อไป</span>
                <span class="num text-slate-900 dark:text-slate-200 font-medium text-base">1 บาท</span>
              </div>
            </div>
          </div>

          <div class="border-t border-slate-100 dark:border-slate-800 pt-6">
            <h3 class="text-base font-bold text-slate-900 dark:text-slate-200 mb-4 text-center font-sans">ค่าธรรมเนียม</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-sm text-left">
                <thead>
                  <tr class="text-slate-400 dark:text-slate-500 font-bold border-b border-slate-100 dark:border-slate-800">
                    <th class="py-3 font-sans">รายการ</th>
                    <th class="py-3 text-right font-sans">ตามหนังสือชี้ชวน</th>
                    <th class="py-3 text-right font-sans">เก็บจริง</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800/40 font-num">
                  <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/20 text-slate-900 dark:text-slate-200">
                    <td class="py-3.5 font-medium text-slate-700 dark:text-slate-300 font-sans">ค่าธรรมเนียมเมื่อซื้อหน่วยลงทุน (Front-end Fee)</td>
                    <td class="py-3.5 text-right font-medium">${frontEndProspectus}</td>
                    <td class="py-3.5 text-right font-medium">${frontEndActual}</td>
                  </tr>
                  <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/20 text-slate-900 dark:text-slate-200">
                    <td class="py-3.5 font-medium text-slate-700 dark:text-slate-300 font-sans">ค่าธรรมเนียมการรับซื้อคืนหน่วยลงทุน (Back-end Fee)</td>
                    <td class="py-3.5 text-right font-medium">${backEndProspectus}</td>
                    <td class="py-3.5 text-right font-medium">${backEndActual}</td>
                  </tr>
                  <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/20 text-slate-900 dark:text-slate-200">
                    <td class="py-3.5 font-medium text-slate-700 dark:text-slate-300 font-sans">ค่าธรรมเนียมการสับเปลี่ยนหน่วยลงทุนเข้า (Switching-in Fee)</td>
                    <td class="py-3.5 text-right font-medium">${switchInProspectus}</td>
                    <td class="py-3.5 text-right font-medium">${switchInActual}</td>
                  </tr>
                  <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/20 text-slate-900 dark:text-slate-200">
                    <td class="py-3.5 font-medium text-slate-700 dark:text-slate-300 font-sans">ค่าธรรมเนียมการสับเปลี่ยนหน่วยลงทุนออก (Switching-out Fee)</td>
                    <td class="py-3.5 text-right font-medium">${switchOutProspectus}</td>
                    <td class="py-3.5 text-right font-medium">${switchOutActual}</td>
                  </tr>
                  <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/20 text-slate-900 dark:text-slate-200">
                    <td class="py-3.5 font-medium text-slate-700 dark:text-slate-300 font-sans">ค่าธรรมเนียมการจัดการ (Management Fee)</td>
                    <td class="py-3.5 text-right font-medium">${managementProspectus}</td>
                    <td class="py-3.5 text-right font-medium">${managementActual}</td>
                  </tr>
                  <!-- TER: blue, bold text -->
                  <tr class="font-bold text-brand-600 dark:text-brand-400 text-base">
                    <td class="py-3.5 font-sans">Total Expense Ratio (ค่ารวมประมาณการ TER)</td>
                    <td class="py-3.5 text-right">${terProspectus}</td>
                    <td class="py-3.5 text-right font-extrabold">${terActual}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Panel 5: เอกสารเพิ่มเติม -->
      <div id="panel-documents" class="tab-panel hidden flex flex-col gap-6">
        <div class="max-w-2xl mx-auto w-full mt-2">
          <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3.5 mb-4">
            <h3 class="text-base font-bold text-slate-900 dark:text-slate-200 font-sans">ข้อมูลจากหนังสือชี้ชวน</h3>
            <button onclick="downloadDoc('หนังสือชี้ชวนโครงการ (Prospectus)')" class="px-3 py-1.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-700 dark:text-slate-300 transition flex items-center gap-1.5 font-sans">
              <span>หนังสือชี้ชวน</span>
              <span class="bg-brand-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded-sm">PDF</span>
            </button>
          </div>
          <div class="divide-y divide-slate-100 dark:divide-slate-800/40 text-sm font-semibold">
            <div class="flex justify-between py-3.5">
              <span class="text-slate-500 dark:text-slate-400 font-sans">Recovering Period</span>
              <span class="num text-slate-900 dark:text-slate-200">${getRecoveringPeriodText(recoverVal)}</span>
            </div>
            <div class="flex justify-between py-3.5">
              <span class="text-slate-500 dark:text-slate-400 font-sans">Alpha</span>
              <span class="num ${alphaVal < 0 ? 'text-neg-600' : 'text-pos-600'}">${alphaVal > 0 ? '+' : ''}${alphaVal}%</span>
            </div>
            <div class="flex justify-between py-3.5">
              <span class="text-slate-500 dark:text-slate-400 font-sans">Beta</span>
              <span class="num text-pos-600">${betaVal.toFixed(2)}</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  `;

  // Initialize first view
  switchTab('overview');
  changeMetric('sd');
}

// Call init on load
init();
</script>

</body>
</html>
