<style>
  :root{--bg:#eef2f9;--surf:#ffffff;--surf2:#f5f8fd;--txt:#0f1e37;--sub:#607091;--line:#e6ecf5;--brand:#2456d8}
  .dark{--bg:#0b1220;--surf:#151f33;--surf2:#101929;--txt:#e7edf8;--sub:#93a3c0;--line:#26324b;--brand:#5b8cff}
  html,body{font-family:'Prompt','Noto Sans Thai',sans-serif}
  body{background:radial-gradient(1100px 380px at 100% -8%,rgba(59,110,246,.10),transparent),var(--bg);color:var(--txt)}
  .num{font-family:'Inter','Prompt',sans-serif;font-feature-settings:"tnum"}
  .surf{background:var(--surf)}.surf2{background:var(--surf2)}
  .brd{border:1px solid var(--line)}.brdt{border-top:1px solid var(--line)}.brdb{border-bottom:1px solid var(--line)}
  .sub{color:var(--sub)}
  ::-webkit-scrollbar{width:9px;height:8px}::-webkit-scrollbar-thumb{background:#a9b6cd;border-radius:8px}
  .cs{box-shadow:0 1px 2px rgba(16,30,55,.05),0 10px 30px -16px rgba(16,30,55,.25)}
  .gb{background:linear-gradient(135deg,#2456d8,#4b83ff)}
  .rkrow{transition:background .14s,box-shadow .14s;cursor:pointer}.rkrow:hover{background:var(--surf2)}
  .rkrow.sel{background:var(--surf2);box-shadow:inset 3px 0 0 var(--brand)}
  .select-order{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:7px;background:var(--brand);color:#fff;font:700 10px/1 'Inter',sans-serif;flex:none}
  .compare-card{border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:10px;transition:transform .15s,box-shadow .15s}
  .compare-card:hover{transform:translateY(-1px);box-shadow:0 8px 22px -16px rgba(16,30,55,.4)}
  .metric-cell{background:var(--surf2);border-radius:8px;padding:6px 7px;min-width:0}
  .metric-help{font-size:8px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .chart-note{background:color-mix(in srgb,var(--brand) 8%,var(--surf));border:1px solid color-mix(in srgb,var(--brand) 22%,var(--line))}
  .scope-chip{white-space:nowrap;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid var(--line);background:var(--surf);color:var(--sub);transition:.14s}
  .scope-chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .fund-table{border-collapse:separate;border-spacing:0;width:100%;font-size:11px}.fund-table th{position:sticky;top:0;z-index:8;background:var(--surf2);color:var(--sub);font-weight:700;text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}.fund-table td{padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}.fund-table tbody tr{cursor:pointer;transition:background .13s}.fund-table tbody tr:hover,.fund-table tbody tr.open{background:var(--surf2)}
  .signal-card{border:1px solid var(--line);background:var(--surf2);border-radius:10px;padding:9px 10px;min-width:0;text-align:left;transition:.14s}.signal-card[data-scope]:hover{border-color:color-mix(in srgb,var(--brand) 48%,var(--line));transform:translateY(-1px)}
  .theme-pulse-card{border:1px solid var(--line);background:var(--surf);border-radius:13px;padding:12px;min-width:0;text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s}.theme-pulse-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -18px rgba(16,30,55,.55)}.theme-pulse-card.on{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 15%,transparent)}
  .trend-status{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:999px;font-size:8px;font-weight:800;white-space:nowrap}
  .filter-select{background:var(--surf);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 9px;font-size:11px;outline:none;min-width:0;width:100%}
  .star{color:#cbd5e1;cursor:pointer;font-size:15px;line-height:1}.star.on{color:#f0b429}
  .fpill{white-space:nowrap;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surf);color:var(--sub);cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:5px}
  .fpill:hover{border-color:#93a3c0}.fpill.on{color:#fff;border-color:transparent}
  .frow{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}.frow::-webkit-scrollbar{height:5px}
  .tab{white-space:nowrap;padding:7px 15px;border-radius:11px;font-size:14px;font-weight:700;transition:.15s}
  @keyframes slidedown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .slide{animation:slidedown .22s ease}
  .chev{transition:transform .22s ease}.chev.open{transform:rotate(180deg)}
  .lg{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;font-weight:800;font-family:'Inter',sans-serif;color:#fff;letter-spacing:.2px}
</style>

/* ================= ENTITIES ================= */
function selectedScopeStocks(scope){const ids=Array.isArray(scope)?scope:scope?[scope]:[],names=new Set();ids.forEach(id=>{const sc=SCOPES.find(s=>s.id===id);if(sc)(sc.stocks||[]).forEach(name=>names.add(name));});return names;}
function buildStockEntities(fs,scope){const g={},scopeSet=selectedScopeStocks(scope);
  fs.forEach(f=>(f.top5||[]).forEach(([name,weight])=>{const meta=STOCK_META[name];if(!meta||scopeSet.size&&!scopeSet.has(name))return;const x=g[name]||(g[name]={id:name,name,ticker:meta.ticker,sector:meta.sector,country:meta.country,meta,holdings:[],membersMap:new Map(),totalWeight:0});x.holdings.push({fund:f,weight});x.membersMap.set(f.id,f);x.totalWeight+=weight;}));
  return Object.values(g).map((x,i)=>{const members=[...x.membersMap.values()],ret=x.meta.ret;return{idx:i,kind:'stock',id:x.id,title:`${x.ticker} · ${x.name}`,name:x.name,ticker:x.ticker,sector:x.sector,country:x.country,meta:x.meta,holdings:x.holdings,members,totalWeight:+x.totalWeight.toFixed(1),avgWeight:+(x.totalWeight/members.length).toFixed(1),fundCount:members.length,perf:ret,pop:members.reduce((s,f)=>s+f.pop,0),div:x.meta.div,flowP:{w1:x.totalWeight,m1:x.totalWeight,y1:x.totalWeight},retP:{m1:+(ret*.16).toFixed(1),q1:+(ret*.42).toFixed(1),y1:ret,y3:+(ret*.76).toFixed(1),y5:+(ret*.68).toFixed(1)}};});
}
function computeScopes(){const fs=baseFunds(),g={};
  const add=(k,f)=>{if(!k)return;(g[k]=g[k]||[]).push(f);};
  if(state.tab==='feeder')fs.forEach(f=>add((INSIGHT[f.master]||{}).theme||f.themes[0],f));
  else if(isStockTab()){SCOPES=stockTaxonomy().map((def,i)=>{let members=[],stockNames=[];if(def.fundIds){members=fs.filter(f=>def.fundIds.includes(f.id));stockNames=[...new Set(members.flatMap(f=>(f.top5||[]).map(h=>h[0])).filter(name=>STOCK_META[name]))];}else{const wanted=new Set(def.stocks||[]);stockNames=[...wanted].filter(name=>STOCK_META[name]&&fs.some(f=>(f.top5||[]).some(h=>h[0]===name)));members=fs.filter(f=>(f.top5||[]).some(h=>wanted.has(h[0])));}const memberIds=new Set(members.map(f=>f.id));let exposure=0,weightedReturn=0;fs.forEach(f=>(f.top5||[]).forEach(([name,weight])=>{if(!STOCK_META[name]||!stockNames.includes(name)||def.fundIds&&!memberIds.has(f.id))return;exposure+=weight;weightedReturn+=weight*STOCK_META[name].ret;}));const hasData=exposure>0;return{id:def.id,title:def.title,subtitle:def.subtitle,idx:i,members,stocks:stockNames,stockCount:stockNames.length,exposure:+exposure.toFixed(1),perf:hasData?+(weightedReturn/exposure).toFixed(1):null,flow:+exposure.toFixed(1),hasData};});state.stockScopeSelections=state.stockScopeSelections.filter(id=>SCOPES.some(s=>s.id===id&&s.hasData));state.scope=null;return;}
  else fs.forEach(f=>(f.mix||f.asset||[]).filter(a=>a[1]>=10).forEach(a=>add(a[0],f)));
  SCOPES=Object.entries(g).map(([k,ms],i)=>{const uniq=[...new Map(ms.map(f=>[f.id,f])).values()];return{id:k,title:k,idx:i,members:uniq,perf:+(uniq.reduce((s,f)=>s+f.perf,0)/uniq.length).toFixed(1),flow:uniq.reduce((s,f)=>s+f.netbuy,0)};});
  if(state.tab==='feeder')state.themeSelections=state.themeSelections.filter(id=>SCOPES.some(s=>s.id===id));
  if(state.scope&&!SCOPES.some(s=>s.id===state.scope))state.scope=null;
}
function computeEntities(){const fs=funds();
  if(isStockTab()){ENTS=buildStockEntities(baseFunds(),state.stockScopeSelections);return;}
  if(state.tab==='mixed'){ENTS=fs.map((f,i)=>({idx:i,kind:'fund',id:f.id,title:f.name,members:[f],perf:f.perf,pop:f.pop,div:f.div,flowP:f.flowP,retP:f.retP}));return;}
  const key=f=>f.master;
  const g={};fs.forEach(f=>{const k=key(f);(g[k]=g[k]||[]).push(f);});
  const avg=a=>+(a.reduce((s,x)=>s+x,0)/a.length).toFixed(1),sum=a=>a.reduce((s,x)=>s+x,0);
  ENTS=Object.entries(g).map(([k,ms],i)=>{const flowP={},retP={};['w1','m1','y1'].forEach(p=>flowP[p]=sum(ms.map(m=>m.flowP[p])));['m1','q1','y1','y3','y5'].forEach(p=>retP[p]=avg(ms.map(m=>m.retP[p])));
    return{idx:i,kind:state.tab==='feeder'?'master':'theme',id:k,title:k,members:ms,perf:avg(ms.map(m=>m.perf)),pop:sum(ms.map(m=>m.pop)),div:Math.max(...ms.map(m=>m.div)),flowP,retP};});}
function autoSelect(){computeScopes();computeEntities();state.groups=[];}

function performanceSeries(seed,fin,n){n=n||13;let s=seed,noise=[0];for(let i=1;i<n;i++){s=(s*9301+49297)%233280;noise.push((s/233280-.5)*10+Math.sin(i*.9+seed%5)*2.8);}const end=noise[n-1];return noise.map((v,i)=>+(100+(fin*i/(n-1))+v-(end*i/(n-1))).toFixed(1));}

  if(q)fs=fs.filter(f=>[f.name,f.master||'',...(f.top5||[]).map(t=>t[0]),...(f.themes||[])].join(' ').toLowerCase().includes(q));
  const value=(f,k)=>k==='return'?f.perf:k==='sd'?f.st.sd:k==='sharpe'?f.st.sharpe:k==='maxdd'?f.st.maxdd:k==='fee'?f.fee:k==='nav'?f.nav:k==='minInvest'?f.minInvest:k==='name'?f.name:f.risk;

      <div>
        <div class="text-[10px] font-bold sub mb-1">Calendar Year Returns (ผลตอบแทนรายปี)</div>
        <div class="h-32 surf2 brd rounded-lg p-2 mb-2"><canvas id="${S}-cyr"></canvas></div>
        <div class="grid grid-cols-3 gap-2">${stat('Sharpe',f.st.sharpe)}${stat('Max Drawdown',f.st.maxdd+'%','text-neg-600')}${stat('Recovery',f.st.recover+' ด.')}</div>
      </div>
      <!-- น้ำหนักพอร์ต + เซคเตอร์ -->
      <div>
        <div class="text-[10px] font-bold sub mb-1">น้ำหนักพอร์ต (Asset Allocation)</div>
        <div class="h-28 surf2 brd rounded-lg p-2 mb-2"><canvas id="${S}-asset"></canvas></div>
        <div class="text-[10px] font-bold sub mb-1">สัดส่วนกลุ่มอุตสาหกรรม (Sector)</div>
        <div>${hbarsHTML(f.sectors,acc)}</div>
      </div>
      <!-- Top 5 + ต้นทุน + เอกสาร + ปุ่ม -->
      <div>
        <div class="text-[10px] font-bold sub mb-1">Top 5 Holdings (ทรัพย์สินที่ถือ)</div>
        <div class="mb-2">${hbarsHTML(f.top5,acc)}</div>
        <div class="flex items-center gap-2 mb-2 flex-wrap"><span class="num text-[11px] font-bold px-2.5 py-1 rounded-md surf2">TER: ${f.fee.toFixed(2)}%</span>${fxBadge(f)}</div>
        <div class="flex items-center gap-4 mb-2.5 pb-2.5 brdb">${pdfLink('หนังสือชี้ชวน')}${pdfLink('Factsheet')}</div>
        <div class="flex items-center gap-2">
          <button data-cmp="${f.id}" onclick="togglePin('${f.id}')" class="flex-1 py-2 rounded-lg text-[13px] font-bold border ${isPin(f.id)?'bg-brand-600 text-white border-brand-600':'surf2 text-brand-700 border-brand-200'}">${isPin(f.id)?'✓ อยู่ในเปรียบเทียบ':'เปรียบเทียบ'}</button>
          <button onclick="exploreFund('${f.id}')" class="flex-1 py-2 rounded-lg text-[13px] font-extrabold text-white" style="background:${acc}">ดูข้อมูลเพิ่มเติม</button>
        </div>
      </div>
    </div></div>`;
  return `<div class="surf brd rounded-xl cs overflow-hidden" style="${ring}">${head}${panel}</div>`;}
function toggleFund(id){const opening=!state.open.has(id);opening?state.open.add(id):state.open.delete(id);render();if(opening)setTimeout(()=>{const card=document.getElementById('card-'+sid(id));if(card)card.scrollIntoView({behavior:'smooth',block:'nearest'});},60);}
function closeAllFunds(){state.open.clear();render();}
function buildAsset(f){const el=document.getElementById(sid(f.id)+'-asset');if(!el)return;const id=sid(f.id)+'-asset';destroyChart(id);
  const arr=f.asset,cols=['#2456d8','#0e7ac0','#12b76a','#e0a411','#7a5af5','#64748b'];
  charts[id]=new Chart(el,{type:'doughnut',data:{labels:arr.map(a=>a[0]),datasets:[{data:arr.map(a=>a[1]),backgroundColor:cols,borderColor:'rgba(255,255,255,.6)',borderWidth:1.5}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'right',labels:{boxWidth:8,font:{size:8},padding:3}},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.parsed}%`}}}}});}
function exploreFund(id){
  window.open(`fund_detail.html?id=${id}`, '_blank');
}
function buildCyr(f){const el=document.getElementById(sid(f.id)+'-cyr');if(!el)return;const id=sid(f.id)+'-cyr';destroyChart(id);
  charts[id]=new Chart(el,{type:'bar',data:{labels:f.cyr.map(c=>c[0]),datasets:[{data:f.cyr.map(c=>c[1]),backgroundColor:f.cyr.map(c=>c[1]<0?'#f04438':'#12b76a'),borderRadius:4,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.y>0?'+':''}${c.parsed.y}%`}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{ticks:{font:{size:9},callback:v=>v+'%'},grid:{color:'rgba(148,163,184,.14)'}}}}});}

/* ================= PIN / COMPARE / WATCHLIST ================= */
function togglePin(id){isPin(id)?pins=pins.filter(x=>x!==id):pins.push(id);savePins();
  document.querySelectorAll('.star[data-pin="'+id+'"]').forEach(el=>{el.classList.toggle('on',isPin(id));el.textContent=isPin(id)?'★':'☆';});
  renderCompare();updateCmpBtn();updateWatchCount();render();}
function updateWatchCount(){const el=document.getElementById('wN');if(el)el.textContent=pins.length;}
function toggleWatch(){const p=document.getElementById('watchPanel');p.classList.toggle('hidden');if(!p.classList.contains('hidden'))renderWatch();}
function renderWatch(){const p=document.getElementById('watchPanel');const items=pins.map(id=>FUNDS.find(f=>f.id===id)).filter(Boolean);
  p.innerHTML=`<div class="px-3 py-2 brdb text-[12px] font-bold">⭐ รายการติดตาม (${items.length})</div>`+
   (items.length?`<div class="max-h-80 overflow-auto">`+items.map(f=>`<div class="flex items-center gap-2 px-3 py-2 brdb rkrow" onclick="gotoFund('${f.id}')">${avatar(f.amcCode,avColor(f.amc),28)}<div class="min-w-0 flex-1"><div class="text-[12px] font-semibold truncate">${f.name}</div><div class="text-[10px] sub truncate">${TYPES[f.type].label}</div></div><span class="text-[12px]">${pct(f.perf)}</span>${starEl(f.id)}</div>`).join('')+`</div>`
     :`<div class="p-5 text-center text-[12px] sub">ยังไม่มีกองที่ติดตาม<br>กดรูปดาว ☆ เพื่อเพิ่ม</div>`);}
function gotoFund(id){const f=FUNDS.find(x=>x.id===id);if(!f)return;document.getElementById('watchPanel').classList.add('hidden');
  state.tab=f.type;state.scope=null;state.scopeMode=f.type==='offshore'?'region':f.type==='thai'?'thaiIndustry':'sector';state.themeSelections=[];state.stockScopeSelections=[];state.themeView='interesting';state.search='';state.filt={};state.quick={wrapper:'',amc:'',dividend:'',minInvest:''};state.metric={};state.metricOpen=new Set();state.advOpen=false;state.open=new Set([id]);computeScopes();computeEntities();const ent=!isStockTab()&&ENTS.find(e=>e.members.some(m=>m.id===id));state.groups=ent?[ent.id]:[];document.getElementById('search').value='';render();
  setTimeout(()=>{const c=document.getElementById('card-'+sid(id));if(c)c.scrollIntoView({behavior:'smooth',block:'center'});},90);}
document.addEventListener('click',ev=>{const p=document.getElementById('watchPanel');if(!p||p.classList.contains('hidden'))return;if(!p.contains(ev.target)&&!ev.target.closest('#watchBtn'))p.classList.add('hidden');});
function scrollCmp(){document.getElementById('cmp').scrollIntoView({behavior:'smooth'});}
function updateCmpBtn(){document.getElementById('cmpN').textContent=pins.length;document.getElementById('cmpBtn').classList.toggle('hidden',pins.length<2);}
function renderCompare(){const wrap=document.getElementById('cmp');const items=pins.map(id=>FUNDS.find(f=>f.id===id)).filter(Boolean);
  if(items.length<2){wrap.classList.add('hidden');wrap.innerHTML='';return;}wrap.classList.remove('hidden');
  const rows=[['ประเภท',f=>TYPES[f.type].label],['1Y Return',f=>pct(f.perf)],['Sharpe Ratio',f=>`<b class="num">${f.st.sharpe}</b>`],['Max Drawdown',f=>`<b class="num text-neg-600">${f.st.maxdd}%</b>`],['เงินปันผล',f=>`<b class="num text-pos-600">${f.div.toFixed(1)}%</b>`],['TER (ค่าธรรมเนียม)',f=>`<b class="num">${f.fee.toFixed(2)}%</b>`],['Master Fund',f=>f.master||'—']];
  wrap.innerHTML=`<div class="surf rounded-xl cs overflow-hidden" style="border:2px solid ${TYPES[state.tab].acc}"><div class="gb text-white px-3 py-2 flex items-center gap-2 text-[13px] font-bold">🔬 เปรียบเทียบกองที่เลือก (${items.length})<button onclick="pins=[];savePins();render()" class="ml-auto text-white/80 text-[11px]">ล้าง ✕</button></div>
    <div class="overflow-x-auto"><table class="w-full text-[11px]"><thead><tr class="surf2"><th class="text-left p-2 sub sticky left-0 surf2">ข้อมูล</th>${items.map(f=>`<th class="p-2 text-left font-extrabold min-w-[130px]">${f.id}<div class="text-[10px] sub font-normal">${f.amc}</div></th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="p-2 sub sticky left-0 surf">${r[0]}</td>${items.map(f=>`<td class="p-2">${r[1](f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;}

/* ================= RENDER ================= */
function render(){state.search=document.getElementById('search').value;const t=TYPES[state.tab];
  document.getElementById('pt').textContent=t.label;document.getElementById('ps').textContent=t.sub;
  document.getElementById('search').placeholder=isStockTab()?'ค้นหาชื่อกองทุน / หุ้นที่ถือ (NVIDIA, Microsoft, PTT, ADVANC)':'ค้นหาชื่อกองทุน / Master Fund / หุ้นที่ถือ (NVIDIA, Samsung, PTT)';
  computeScopes();computeEntities();state.groups=state.groups.filter(id=>ENTS.some(e=>e.id===id));renderTabs();renderTrend();renderCards();renderSelectionBar();renderInsight();renderQuickFilters();renderFilters();
  const list=currentFunds();
  document.getElementById('cnt').textContent=`พบ ${list.length} กองทุน`;
  document.getElementById('tableHeading').textContent=isStockTab()?`⑤ กองทุนไทยที่${state.groups.length?'ถือหุ้นที่เลือก':'ลงทุนตรงในหุ้น'+(state.tab==='offshore'?'ต่างประเทศ':'ไทย')}`:'⑤ ตารางกองทุนที่เกี่ยวข้อง';
  renderFundTable(list);
  const opened=list.filter(f=>state.open.has(f.id)),drawerHeading=document.getElementById('drawerHeading');drawerHeading.classList.toggle('hidden',!opened.length);drawerHeading.innerHTML=opened.length?`<div class="flex items-center gap-2"><span class="text-[11px] font-bold sub uppercase tracking-wide">⑥ รายละเอียดกองทุนที่เปิด</span><span class="num text-[9px] font-bold px-2 py-0.5 rounded-full surf brd">${opened.length} กอง</span><button onclick="closeAllFunds()" class="ml-auto text-[10px] font-bold px-2.5 py-1 rounded-lg surf brd">ปิดทั้งหมด ✕</button></div>`:'';document.getElementById('list').innerHTML=opened.map(f=>`<div id="card-${sid(f.id)}">${fundRow(f)}</div>`).join('');
  document.getElementById('empty').classList.add('hidden');
  FUNDS.filter(f=>!state.open.has(f.id)).forEach(f=>{destroyChart(sid(f.id)+'-cyr');destroyChart(sid(f.id)+'-asset');});
  opened.forEach(f=>{buildCyr(f);buildAsset(f);});
  renderCompare();updateCmpBtn();updateWatchCount();
  document.getElementById('themeBtn').textContent=document.documentElement.classList.contains('dark')?'☀️':'🌙';
}
autoSelect();render();
</script>
</body>
</html>
